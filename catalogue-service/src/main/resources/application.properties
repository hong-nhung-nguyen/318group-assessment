spring.application.name=catalogue-service

server.port=8081

spring.datasource.url=jdbc:h2:mem:cataloguedb;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Populate sample packages and departures on startup (set to false to disable)
catalogue.seed.enabled=true

spring.cloud.function.definition=bookingCreated;bookingConfirmed;bookingFailed

spring.cloud.stream.bindings.bookingCreated-in-0.destination=booking-created
spring.cloud.stream.bindings.bookingCreated-in-0.group=catalogue-service
spring.cloud.stream.bindings.bookingCreated-in-0.content-type=application/json

spring.cloud.stream.bindings.inventoryReserved-out-0.destination=inventory-reserved
spring.cloud.stream.bindings.inventoryReserved-out-0.content-type=application/json

spring.cloud.stream.bindings.inventoryRejected-out-0.destination=inventory-rejected
spring.cloud.stream.bindings.inventoryRejected-out-0.content-type=application/json

spring.cloud.stream.kafka.binder.brokers=localhost:9092

spring.cloud.stream.bindings.bookingConfirmed-in-0.destination=booking-confirmed
spring.cloud.stream.bindings.bookingConfirmed-in-0.group=catalogue-service
spring.cloud.stream.bindings.bookingConfirmed-in-0.content-type=application/json

spring.cloud.stream.bindings.bookingFailed-in-0.destination=booking-failed
spring.cloud.stream.bindings.bookingFailed-in-0.group=catalogue-service
spring.cloud.stream.bindings.bookingFailed-in-0.content-type=application/json